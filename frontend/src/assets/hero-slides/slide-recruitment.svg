<!--
  PLACEHOLDER hero slide illustration (flat, abstract — not a real photo).
  See slide-training.svg for the swap-out note.
-->
<svg width="600" height="440" viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slideRecruitmentTitle">
  <title id="slideRecruitmentTitle">Illustration of a recruiter reviewing candidate profile cards with a magnifying glass</title>
  <defs>
    <linearGradient id="bgRecruitment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7edfd" />
      <stop offset="100%" stop-color="#fff4e0" />
    </linearGradient>
  </defs>
  <rect width="600" height="440" rx="24" fill="url(#bgRecruitment)" />
  <circle cx="500" cy="100" r="70" fill="#ffffff" opacity="0.5" />
  <circle cx="90" cy="370" r="70" fill="#ffffff" opacity="0.5" />

  <!-- profile cards -->
  <g>
    <rect x="150" y="150" width="120" height="150" rx="10" fill="#ffffff" stroke="#e2e7f1" stroke-width="2" />
    <circle cx="210" cy="195" r="20" fill="#2159d1" />
    <rect x="175" y="225" width="70" height="8" rx="4" fill="#cdd5e5" />
    <rect x="185" y="240" width="50" height="8" rx="4" fill="#e2e7f1" />
  </g>
  <g transform="translate(150 0)">
    <rect x="150" y="130" width="120" height="150" rx="10" fill="#ffffff" stroke="#e2e7f1" stroke-width="2" />
    <circle cx="210" cy="175" r="20" fill="#1f9d4f" />
    <rect x="175" y="205" width="70" height="8" rx="4" fill="#cdd5e5" />
    <rect x="185" y="220" width="50" height="8" rx="4" fill="#e2e7f1" />
  </g>

  <!-- magnifying glass -->
  <g transform="translate(360 150)">
    <circle cx="60" cy="60" r="52" fill="#ffffff" stroke="#0a1c37" stroke-width="10" />
    <circle cx="60" cy="60" r="52" fill="#2bbf62" opacity="0.15" />
    <line x1="98" y1="98" x2="140" y2="140" stroke="#0a1c37" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>

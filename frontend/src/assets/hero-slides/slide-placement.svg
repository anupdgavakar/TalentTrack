<!--
  PLACEHOLDER hero slide illustration (flat, abstract — not a real photo).
  See slide-training.svg for the swap-out note.
-->
<svg width="600" height="440" viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slidePlacementTitle">
  <title id="slidePlacementTitle">Illustration of two people shaking hands over a job placement, with a briefcase</title>
  <defs>
    <linearGradient id="bgPlacement" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4f8ea" />
      <stop offset="100%" stop-color="#e7edfd" />
    </linearGradient>
  </defs>
  <rect width="600" height="440" rx="24" fill="url(#bgPlacement)" />
  <circle cx="500" cy="360" r="80" fill="#ffffff" opacity="0.5" />
  <circle cx="90" cy="80" r="60" fill="#ffffff" opacity="0.5" />

  <!-- ground line -->
  <rect x="120" y="330" width="360" height="10" rx="5" fill="#cdd5e5" />

  <!-- person left -->
  <circle cx="230" cy="190" r="32" fill="#0f1524" opacity="0.9" />
  <path d="M175 330 C175 260 285 260 285 330 Z" fill="#2159d1" />
  <path d="M255 250 L300 225" stroke="#0f1524" stroke-width="10" stroke-linecap="round" opacity="0.9" />

  <!-- person right -->
  <circle cx="370" cy="190" r="32" fill="#0f1524" opacity="0.9" />
  <path d="M315 330 C315 260 425 260 425 330 Z" fill="#1f9d4f" />
  <path d="M345 250 L300 225" stroke="#0f1524" stroke-width="10" stroke-linecap="round" opacity="0.9" />

  <!-- handshake knot -->
  <circle cx="300" cy="225" r="14" fill="#8fe23f" />

  <!-- briefcase -->
  <g transform="translate(268 300)">
    <rect x="0" y="8" width="64" height="42" rx="6" fill="#0a1c37" />
    <rect x="20" y="0" width="24" height="14" rx="4" fill="none" stroke="#0a1c37" stroke-width="6" />
    <rect x="0" y="24" width="64" height="8" fill="#2bbf62" />
  </g>
</svg>
